# Copy to config.toml and fill in.

# Lock file used to stop two runs overlapping. Defaults to the system temp dir.
# lock_file = "/var/lock/imap-to-papra.lock"


[imap]
host = "mail.example.com"
port = 993
username = "papra-intake@example.com"
password = ""

mailbox = "INBOX"

# Implicit TLS on 993. For explicit TLS on 143 set ssl = false, starttls = true.
ssl = true
starttls = false
verify_ssl = true

# What to do with a message once all its attachments are in Papra.
#   delete    -> flag \Deleted and expunge
#   move      -> move to move_to, creating it if needed
#   mark_read -> set \Seen and leave it in place
on_success = "delete"
move_to = "Processed"

# Messages per run. 0 = no limit.
batch_size = 50
timeout_seconds = 60


[papra]
# Root URL, no trailing /api.
base_url = "https://papra.example.com"

# Needs the documents:create and documents:read permissions.
api_key = ""

# Find it with:
#   curl -H "Authorization: Bearer $KEY" https://papra.example.com/api/organizations
organization_id = "org_replace_me"

verify_ssl = true
timeout_seconds = 60
max_retries = 3

# Passed to Papra's OCR. Empty uses the server default.
# ocr_languages = ["eng", "ita"]
ocr_languages = []


[attachments]
# Empty allowed list accepts anything not in denied.
# allowed = ["pdf", "jpg", "jpeg", "png", "docx", "xlsx"]
allowed = []
denied = ["p7s", "asc", "vcf", "ics"]

# Filters out signature logos and tracking pixels.
min_size_bytes = 1024

# Match Papra's DOCUMENT_STORAGE_MAX_UPLOAD_SIZE. Anything larger is reported as
# a failure and left in the mailbox rather than dropped.
max_size_bytes = 26214400

# Skip parts marked inline or referenced by cid: from the HTML body.
skip_inline = true


[ntfy]
enabled = false
server = "https://ntfy.sh"
topic = "imap-to-papra"
token = ""
priority = "default"

# Use ["error"] alone for errors only.
notify_on = ["success", "error"]
timeout_seconds = 10


[logging]
level = "INFO"      # DEBUG, INFO, WARNING, ERROR, CRITICAL
format = "text"     # text or json
