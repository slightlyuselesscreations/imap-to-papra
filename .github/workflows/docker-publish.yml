# Tags:
#   push to main  -> :edge, :sha-<short>
#   tag v1.2.3    -> :1.2.3, :1.2, :1, :latest
#   pull request  -> build only, no push
#
# Docs-only pushes to main are skipped. Path filters are ignored for tag
# pushes, so a release still builds even if the tagged commit only touched
# markdown: https://github.com/actions/runner/issues/3933
#
# The first push creates the package as private. Set it to Public at
# github.com/orgs/slightlyuselesscreations/packages/container/imap-to-papra/settings

name: Build and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Install on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install the package
        run: pip install .

      - name: Console script responds
        run: |
          imap-to-papra --version
          imap-to-papra --help

      - name: Incomplete configuration exits 2 rather than crashing
        env:
          IMAP_HOST: mail.example.com
          PAPRA_BASE_URL: https://papra.example.com
        run: |
          set +e
          imap-to-papra
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 (config error), got $code" >&2
            exit 1
          fi

  image:
    name: Image (amd64, arm64)
    runs-on: ubuntu-latest
    needs: smoke
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Compute lowercase image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=auto
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=imap-to-papra
            org.opencontainers.image.description=Archive IMAP mail attachments into a self-hosted Papra instance

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Verify the published image runs
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm --entrypoint imap-to-papra \
            "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}" --version

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
